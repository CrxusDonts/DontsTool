<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-surface": "#111827",
            "on-surface-variant": "#6B7280",
            "outline-variant": "#E5E7EB",
            "primary": "#007AFF",
            "surface-bright": "#F9FAFB",
            "surface-container": "#F3F4F6",
            "surface-container-high": "#ECEFF2",
            "background": "#F3F4F6"
          },
          fontFamily: {
            sans: ["-apple-system", "BlinkMacSystemFont", "SF Pro Text", "SF Pro Display", "PingFang SC", "system-ui", "sans-serif"],
            mono: ["SF Mono", "Menlo", "Monaco", "Consolas", "monospace"]
          }
        }
      }
    }
  </script>
<style>
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .caret-blink {
      animation: cursor-blink 1.05s infinite;
    }

    /* macOS Micro-dots subtle light wallpaper background */
    .bg-grid-dots {
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Native macOS translucent scrollbar styling */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.16);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.28);
    }

    /* Motion specifications */
    .panel-enter {
      animation: panelIn 220ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .panel-exit {
      animation: panelOut 140ms cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes panelIn {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes panelOut {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.985);
      }
    }

    /* Item stagger entrance */
    .row-stagger-1 { animation: fadeInRow 120ms ease-out 20ms both; }
    .row-stagger-2 { animation: fadeInRow 120ms ease-out 40ms both; }
    .row-stagger-3 { animation: fadeInRow 120ms ease-out 60ms both; }
    .row-stagger-4 { animation: fadeInRow 120ms ease-out 80ms both; }
    .row-stagger-5 { animation: fadeInRow 120ms ease-out 100ms both; }

    @keyframes fadeInRow {
      from {
        opacity: 0;
        transform: translateY(3px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .row-item {
      transition: background-color 100ms ease, color 100ms ease, transform 140ms ease;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
        transform: none !important;
      }
    }
  </style>
</head>

<!-- Interactive Keyboard Navigation & Behavior Script -->
<script>
    (function () {
      const panel = document.getElementById('launcher-panel');
      const rows = Array.from(document.querySelectorAll('.row-item'));
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      const clearBtn = document.getElementById('clear-btn');
      const queryText = document.getElementById('search-query-text');
      let currentIndex = 2; // Default selected is notes.md (index 2)
      let isClosed = false;

      function updateSelection(newIndex) {
        if (newIndex < 0) newIndex = 0;
        if (newIndex >= rows.length) newIndex = rows.length - 1;
        currentIndex = newIndex;

        rows.forEach((row, idx) => {
          const title = row.querySelector('.row-title');
          const sub = row.querySelector('.row-sub');
          const action = row.querySelector('.row-action');
          const iconWrapper = row.querySelector('.w-8');

          if (idx === currentIndex) {
            row.classList.add('is-selected', 'bg-[#007AFF]', 'text-white', 'shadow-sm');
            row.classList.remove('hover:bg-black/[0.04]');
            if (title) {
              title.classList.remove('text-[#111827]');
              title.classList.add('text-white', 'font-semibold');
            }
            if (sub) {
              sub.classList.remove('text-[#6B7280]');
              sub.classList.add('text-white/85');
            }
            if (action) {
              action.className = 'row-action flex items-center pl-2 flex-shrink-0';
              action.innerHTML = `
                <div class="inline-flex items-center gap-1 px-2 py-0.5 rounded-[5px] bg-white/25 border border-white/30 text-white font-medium text-[11px] shadow-xs">
                  <span>打开</span>
                  <span class="text-[10px] font-mono leading-none">↵</span>
                </div>
              `;
            }
            if (iconWrapper && !iconWrapper.classList.contains('bg-white/20')) {
              iconWrapper.dataset.originalBg = iconWrapper.className;
              iconWrapper.className = 'w-8 h-8 rounded-[7px] bg-white/20 border border-white/30 flex items-center justify-center shadow-xs flex-shrink-0 text-white';
            }
            row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          } else {
            row.classList.remove('is-selected', 'bg-[#007AFF]', 'text-white', 'shadow-sm');
            row.classList.add('hover:bg-black/[0.04]');
            if (title) {
              title.classList.remove('text-white', 'font-semibold');
              title.classList.add('text-[#111827]');
            }
            if (sub) {
              sub.classList.remove('text-white/85');
              sub.classList.add('text-[#6B7280]');
            }
            if (action) {
              action.className = 'row-action opacity-0 group-hover:opacity-100 transition-opacity duration-150 flex items-center pl-2';
              action.innerHTML = `<span class="text-[10px] text-[#6B7280] font-mono px-1.5 py-0.5 rounded bg-black/[0.05] border border-black/5">打开</span>`;
            }
            if (iconWrapper && iconWrapper.dataset.originalBg) {
              iconWrapper.className = iconWrapper.dataset.originalBg;
            }
          }
        });
      }

      function showToast(message) {
        toastText.textContent = message;
        toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
        toast.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
        }, 1200);
      }

      function executeCurrent() {
        const selected = rows[currentIndex];
        const title = selected.querySelector('.row-title')?.textContent?.trim() || '项目';
        showToast(`已执行：${title}`);
      }

      function closePanel() {
        if (isClosed) return;
        isClosed = true;
        panel.classList.remove('panel-enter');
        panel.classList.add('panel-exit');
        setTimeout(() => {
          panel.style.visibility = 'hidden';
          // Pressing Escape again or clicking will revive for interactive demo
          showToast('面板已关闭 (按任意键或点击重新唤起)');
        }, 140);
      }

      function openPanel() {
        if (!isClosed) return;
        isClosed = false;
        panel.style.visibility = 'visible';
        panel.classList.remove('panel-exit');
        panel.classList.add('panel-enter');
      }

      // Click on row to select and trigger
      rows.forEach((row, idx) => {
        row.addEventListener('click', () => {
          updateSelection(idx);
          executeCurrent();
        });
        row.addEventListener('mouseenter', () => {
          updateSelection(idx);
        });
      });

      // Clear button behavior
      clearBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        if (queryText.textContent) {
          queryText.textContent = '';
          showToast('已清除搜索词');
        } else {
          queryText.textContent = 'note';
        }
      });

      // Global keyboard handler
      window.addEventListener('keydown', (e) => {
        if (isClosed) {
          openPanel();
          return;
        }

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          updateSelection(currentIndex + 1);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          updateSelection(currentIndex - 1);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (e.metaKey) {
            const selected = rows[currentIndex];
            const sub = selected.querySelector('.row-sub')?.textContent?.trim() || '';
            showToast(`在 Finder 中定位：${sub}`);
          } else {
            executeCurrent();
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closePanel();
        }
      });

      document.body.addEventListener('click', (e) => {
        if (isClosed) {
          openPanel();
        }
      });
    })();
  </script>
