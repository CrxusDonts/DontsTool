name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  test:
    name: Core and WebKit tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Prepare build tools
        run: |
          xcodebuild -version
          swift --version
          brew list --versions xcodegen >/dev/null || brew install xcodegen
          xcodegen --version
      - name: Verify offline notes editor
        run: |
          make test-editor
          git diff --exit-code -- Resources/NotesEditor
      - name: Test release tag resolution
        run: ./scripts/tests/test-release-tag.sh
      - name: Test signed update feeds
        run: make test-updater
      - name: Test Core
        run: |
          mkdir -p build
          make test 2>&1 | tee build/core-tests.log
      - name: Test native WebKit bridge
        run: make test-bridge 2>&1 | tee build/bridge-tests.log
      - name: Keep test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: |
            build/*.log
            build/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
