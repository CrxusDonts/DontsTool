<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">DontsTool — 原生 macOS 研发效率工具</title>
  <desc id="desc">石墨色封面，左侧是 DontsTool 标题和键盘快捷键，右侧是输入 gh a 打开项目网址的启动器示意。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1280" height="420" rx="24" fill="#1c2524"/>
  <path d="M0 366H1280M611 0V420" stroke="#33413c" stroke-opacity=".45"/>
  <circle cx="1250" cy="-8" r="130" fill="none" stroke="#476d5d" stroke-opacity=".35"/>
  <circle cx="1250" cy="-8" r="172" fill="none" stroke="#476d5d" stroke-opacity=".18"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="72" y="64" width="38" height="38" rx="11" fill="#b1d5c2"/>
    <text x="91" y="89" text-anchor="middle" font-size="17" font-weight="750" fill="#21372c">DT</text>
    <text x="125" y="89" font-size="15" letter-spacing="2" fill="#a6bdb1">原生 macOS · 研发效率工具</text>
    <text x="68" y="191" font-size="72" font-weight="700" letter-spacing="-3" fill="#f4f1e9">DontsTool</text>
    <text x="73" y="238" font-size="22" fill="#bdc8c0">搜索、跳转、处理文本，一次唤起。</text>
    <g font-size="14" fill="#c8d7ce">
      <rect x="73" y="281" width="100" height="34" rx="8" fill="#2c3b34" stroke="#43564b"/>
      <text x="123" y="303" text-anchor="middle">⌥ Space</text>
      <rect x="183" y="281" width="94" height="34" rx="8" fill="#2c3b34"/>
