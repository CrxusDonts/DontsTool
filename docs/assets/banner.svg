      <rect x="287" y="281" width="94" height="34" rx="8" fill="#2c3b34"/>
      <text x="334" y="303" text-anchor="middle">本地优先</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="649" y="67" width="557" height="280" rx="18" fill="#283330" stroke="#48574f"/>
