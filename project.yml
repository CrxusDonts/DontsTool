name: DontsTool
options:
  bundleIdPrefix: com.donts
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    CLANG_ENABLE_MODULES: YES

targets:
  DontsToolCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/DontsToolCore
    settings:
      base:
        PRODUCT_MODULE_NAME: DontsToolCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  DontsTool:
    type: application
    platform: macOS
    sources:
      - path: Sources/DontsTool
    dependencies:
      - target: DontsToolCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donts.DontsTool
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  DontsToolCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DontsToolCoreTests
    dependencies:
      - target: DontsToolCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donts.DontsToolCoreTests
        GENERATE_INFOPLIST_FILE: YES

  DontsToolBridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DontsToolBridgeTests
      - path: Sources/DontsTool/Shell/Knowledge/KnowledgeWebBridge.swift
      - path: Sources/DontsTool/Shell/Knowledge/KnowledgeWindowController.swift
      - path: Sources/DontsTool/UI/Knowledge/KnowledgeWindowView.swift
      - path: Sources/DontsTool/UI/Tools/ToolTheme.swift
      - path: Sources/DontsTool/UI/DesignSystem/Theme.swift
    dependencies:
      - target: DontsToolCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donts.DontsToolBridgeTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DontsToolBridgeTests:
    build:
      targets:
        DontsToolBridgeTests: [test]
    test:
      config: Debug
      targets:
        - DontsToolBridgeTests
  DontsTool:
    build:
      targets:
        DontsTool: all
        DontsToolCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DontsToolCoreTests
    archive:
      config: Release
