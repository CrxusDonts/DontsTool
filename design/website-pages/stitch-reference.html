<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DontsTool Launcher</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Theme Configuration Verbatim -->
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary-container": "#005144",
            "background": "#0b0f11",
            "secondary-container": "#393c3b",
            "on-primary": "#00493e",
            "inverse-primary": "#006c5b",
            "inverse-on-surface": "#525559",
            "outline": "#6a7780",
            "tertiary-container": "#dcf2ce",
            "on-error": "#490106",
            "tertiary-fixed-dim": "#d6ecc9",
            "secondary": "#9b9f9c",
            "surface-container": "#131b20",
            "on-primary-container": "#7be3cb",
            "surface-container-highest": "#1b272f",
            "on-secondary": "#1d2120",
            "surface-container-lowest": "#000000",
            "outline-variant": "#3d4a52",
            "error": "#ee7d77",
            "primary-fixed": "#8df5dd",
            "secondary-fixed-dim": "#d2d5d3",
            "on-secondary-fixed-variant": "#595c5a",
            "primary-fixed-dim": "#7fe7cf",
            "primary-dim": "#62cab4",
            "on-tertiary": "#516449",
            "surface-container-low": "#0e1418",
            "tertiary-fixed": "#e4fad7",
            "on-primary-fixed-variant": "#006858",
            "surface": "#0b0f11",
            "on-surface": "#dae7f2",
            "inverse-surface": "#f7fafd",
            "on-tertiary-fixed-variant": "#586b4f",
            "on-tertiary-fixed": "#3c4f35",
            "on-tertiary-container": "#495c41",
            "surface-dim": "#0b0f11",
            "surface-bright": "#1f2e37",
            "on-primary-fixed": "#00483d",
            "tertiary": "#edffe0",
            "error-dim": "#bb5551",
            "secondary-dim": "#9b9f9c",
            "on-secondary-fixed": "#3c403f",
            "surface-tint": "#71d8c1",
            "on-secondary-container": "#bdc0be",
            "secondary-fixed": "#e0e3e1",
            "on-surface-variant": "#a0adb7",
            "primary": "#71d8c1",
            "on-error-container": "#ff9993",
            "surface-container-high": "#172127",
            "surface-variant": "#1b272f",
            "error-container": "#7f2927",
            "tertiary-dim": "#d9efcc",
            "on-background": "#dae7f2"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {},
          "fontFamily": {
            "headline": ["Inter", "-apple-system", "BlinkMacSystemFont", "PingFang SC", "sans-serif"],
            "display": ["Inter", "-apple-system", "BlinkMacSystemFont", "PingFang SC", "sans-serif"],
            "body": ["Inter", "-apple-system", "BlinkMacSystemFont", "PingFang SC", "sans-serif"],
            "label": ["Inter", "-apple-system", "BlinkMacSystemFont", "PingFang SC", "sans-serif"],
            "mono": ["JetBrains Mono", "SF Mono", "Menlo", "Courier New", "monospace"]
          }
        },
      },
    }
  </script>
<style>
    /* Native macOS Window Font smoothing */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      text-rendering: optimizeLegibility;
    }

    /* Subtle cursor blinking animation */
    @keyframes native-cursor-blink {
      0%, 48% { opacity: 1; }
      50%, 98% { opacity: 0; }
      100% { opacity: 1; }
    }
    .animate-mac-cursor {
      animation: native-cursor-blink 1.06s infinite;
    }
    
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
  </style>
</head>
<body class="bg-surface-container-lowest text-on-surface flex items-center justify-center min-h-screen p-4 antialiased font-body selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Desktop Backdrop Representation (Minimalist Desktop) -->
<div class="fixed inset-0 bg-[#141719] pointer-events-none -z-10 flex items-center justify-center opacity-60">
<!-- Subtle radial glow behind the HUD window -->
<div class="w-[800px] h-[600px] bg-surface-tint/5 rounded-full blur-[120px] pointer-events-none"></div>
</div>
<!-- NSPanel Floating Utility HUD Container (Exact 700x480) -->
<div class="w-[700px] h-[480px] rounded-[14px] bg-surface-container/95 border border-outline-variant/60 shadow-[0_24px_64px_rgba(0,0,0,0.6),0_4px_16px_rgba(0,0,0,0.4)] backdrop-blur-2xl flex flex-col overflow-hidden relative select-none">
<!-- Top Search Header (Exact 72px) -->
<header class="h-[72px] shrink-0 px-5 flex items-center justify-between border-b border-outline-variant/40 bg-surface-container-high/40">
<div class="flex items-center gap-3.5 flex-1 min-w-0 pr-3">
<!-- Leading Magnifying Glass Icon -->
<span class="material-symbols-outlined text-outline-variant text-[22px] select-none shrink-0" data-icon="search">search</span>
<!-- Search Query Display with blinking cursor -->
<div class="flex items-center text-[19px] tracking-tight font-headline text-on-surface font-medium w-full"><span class="text-on-surface">ops avatar management</span>
<span class="inline-block w-[1.5px] h-[22px] bg-primary ml-[2px] rounded-full animate-mac-cursor"></span></div>
</div>
<!-- Trailing Action: Compact Keycap 'Esc' -->
<div class="flex items-center shrink-0">
<kbd class="h-6 px-2 min-w-[28px] inline-flex items-center justify-center rounded-[5px] bg-surface-variant/80 border border-outline-variant/60 text-on-surface-variant font-mono text-[11px] font-medium shadow-[inset_0_1px_0_rgba(255,255,255,0.06),0_1px_2px_rgba(0,0,0,0.3)]">
          esc
        </kbd>
</div>
</header>
<!-- Primary Content Area (Fills space between 72px header and 38px footer: 370px) -->
<main class="flex-1 flex flex-col px-3 pt-3.5 pb-2.5 overflow-hidden">
<!-- Section Group Label (compact 11px uppercase/muted) -->
<div class="px-2.5 pb-1.5 flex items-center justify-between text-[11px] font-medium text-outline uppercase tracking-wider select-none font-headline">
<span>网站 · 2 个结果</span>
</div>
<!-- Listbox Result Items (Exactly 2 items, 54px each) -->
<div aria-label="搜索结果" class="flex flex-col gap-1 w-full" role="listbox"><!-- Row 1: SELECTED State (54px) -->
<div aria-selected="true" class="h-[54px] px-3 rounded-[8px] bg-surface-container-high border border-outline-variant/70 flex items-center justify-between gap-3 relative group transition-colors duration-120 cursor-default" role="option">
<!-- Active accent indicator bar -->
<div class="absolute left-0 top-[10px] bottom-[10px] w-[3px] bg-primary rounded-r-full shadow-[0_0_8px_rgba(113,216,193,0.3)]"></div>
<div class="flex items-center gap-3 min-w-0 pl-1">
<!-- Leading Icon -->
<div class="w-8 h-8 rounded-[6px] bg-surface-variant flex items-center justify-center text-primary shrink-0 border border-outline-variant/40">
<span class="material-symbols-outlined text-[18px]" data-icon="language">language</span>
</div>
<!-- Title & URL Subtitle -->
<div class="flex flex-col justify-center min-w-0 leading-tight">
<div class="flex items-center gap-2">
<span class="text-[13px] font-headline font-semibold text-on-surface tracking-tight truncate">Avatar · 管理页</span>
<!-- TEST Environment Badge -->
<span class="px-1.5 py-[1px] rounded-[4px] bg-[#362f1c] text-[#eac374] border border-[#524523] font-mono text-[10px] font-medium tracking-wide">
          TEST
        </span>
</div>
<div class="mt-0.5">
<span class="font-mono text-[11px] text-on-surface-variant/90 tracking-tight truncate block">
          https://avatar.test.company.example/admin/management
        </span>
</div>
</div>
</div>
<!-- Trailing Affordance: Keyboard Keycap -->
<div class="flex items-center gap-1.5 shrink-0 pl-2">
<div class="flex items-center gap-1 px-2 py-1 rounded-[5px] bg-primary-container text-on-primary-container border border-primary/20 text-[11px] font-medium font-headline">
<span class="font-mono text-[12px] leading-none">↵</span>
<span>打开</span>
</div>
</div>
</div>
<!-- Row 2: UNSELECTED State (54px) -->
<div aria-selected="false" class="h-[54px] px-3 rounded-[8px] hover:bg-surface-variant/40 border border-transparent hover:border-outline-variant/40 flex items-center justify-between gap-3 relative group transition-colors duration-120 cursor-default" role="option">
<div class="flex items-center gap-3 min-w-0 pl-1">
<!-- Leading Icon -->
<div class="w-8 h-8 rounded-[6px] bg-surface-variant/60 flex items-center justify-center text-on-surface-variant shrink-0 border border-outline-variant/30">
<span class="material-symbols-outlined text-[18px]" data-icon="language">language</span>
</div>
<!-- Title & URL Subtitle -->
<div class="flex flex-col justify-center min-w-0 leading-tight">
<div class="flex items-center gap-2">
<span class="text-[13px] font-headline font-medium text-on-surface tracking-tight truncate">Avatar · 管理页</span>
<!-- PROD Environment Badge -->
<span class="px-1.5 py-[1px] rounded-[4px] bg-surface-variant text-primary border border-primary/30 font-mono text-[10px] font-medium tracking-wide">
          PROD
        </span>
</div>
<div class="mt-0.5">
<span class="font-mono text-[11px] text-outline tracking-tight truncate block">
          https://avatar.company.example/admin/management
        </span>
</div>
</div>
</div>
<!-- Trailing Affordance -->
<div class="flex items-center gap-1.5 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity duration-120">
<span class="text-[11px] text-outline font-headline">打开</span>
</div>
</div></div>
<!-- Calm Whitespace buffer filling remaining area -->
<div class="flex-1"></div>
<!-- Single Subtle Unobtrusive Bottom Hint Text -->
<div class="px-3 pb-1">
<p class="text-[11px] text-outline/80 font-headline select-none">输入 <span class="font-mono text-on-surface-variant/90 bg-surface-variant/60 px-1 py-0.5 rounded text-[10px]">ops avatar management prod</span> 直达生产管理页</p>
</div>
</main>
<!-- Footer HUD Action Status Bar (Exact 38px high) -->
<footer class="h-[38px] shrink-0 px-4 bg-surface-container-low border-t border-outline-variant/40 flex items-center justify-between text-on-surface-variant text-[11px] select-none font-headline">
<!-- Leading Keyboard Navigation Hints -->
<div class="flex items-center gap-3.5">
<div class="flex items-center gap-1.5">
<div class="flex items-center gap-0.5">
<kbd class="h-[18px] min-w-[16px] px-1 inline-flex items-center justify-center rounded-[3px] bg-surface-variant/80 border border-outline-variant/50 text-[10px] font-mono text-on-surface">↑</kbd>
<kbd class="h-[18px] min-w-[16px] px-1 inline-flex items-center justify-center rounded-[3px] bg-surface-variant/80 border border-outline-variant/50 text-[10px] font-mono text-on-surface">↓</kbd>
</div>
<span class="text-outline">选择</span>
</div>
<div class="flex items-center gap-1.5">
<kbd class="h-[18px] px-1.5 inline-flex items-center justify-center rounded-[3px] bg-surface-variant/80 border border-outline-variant/50 text-[10px] font-mono text-on-surface">↵</kbd>
<span class="text-outline">打开</span>
</div>
<div class="flex items-center gap-1.5">
<kbd class="h-[18px] px-1.5 inline-flex items-center justify-center rounded-[3px] bg-surface-variant/80 border border-outline-variant/50 text-[10px] font-mono text-on-surface">esc</kbd>
<span class="text-outline">关闭</span>
</div>
</div>
<!-- Trailing Action: Tiny Settings Button -->
<div class="flex items-center">
<button class="group flex items-center gap-1.5 text-outline hover:text-on-surface px-1.5 py-0.5 rounded hover:bg-surface-variant/50 transition-colors duration-120" type="button">
<span class="material-symbols-outlined text-[13px] leading-none" data-icon="settings">settings</span>
<span class="text-[11px] font-normal">配置快捷入口</span>
<kbd class="font-mono text-[10px] text-outline group-hover:text-on-surface-variant ml-0.5">⌘,</kbd>
</button>
</div>
</footer>
</div>
</body></html>
