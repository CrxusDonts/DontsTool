<main><header class="toolbar"><div><h2 id="title">01 · 常用与工具</h2><p id="description">空查询时的常用应用与关键词入口。</p></div><div class="links"><button class="motion-button" id="replay" type="button">重播呼出</button><button class="motion-button" id="toggle" type="button">收起 / 呼出</button><label class="reduce-label"><input id="reduce" type="checkbox">减少动态效果</label><a id="source" href="01-launcher.html" target="_blank" rel="noopener">打开 HTML ↗</a><a id="preview" href="previews/01-launcher.png" target="_blank" rel="noopener">查看截图 ↗</a></div></header>

<script>
const screens=[{"slug":"01-launcher","title":"常用与工具","file":"01-launcher.html","description":"空查询时的常用应用与关键词入口。"},{"slug":"02-search","title":"搜索结果","file":"02-search.html","description":"应用、文件分组与键盘选中态。"},{"slug":"03-text-tools","title":"文本工具","file":"03-text-tools.html","description":"JSON 摘要、复制与压缩操作。"},{"slug":"04-translation","title":"翻译","file":"04-translation.html","description":"系统翻译入口与网页兜底。"},{"slug":"05-settings","title":"设置","file":"05-settings.html","description":"独立窗口中的通用设置与索引管理。"}];
const frame=document.querySelector('#screen'),box=document.querySelector('#framebox'),stage=document.querySelector('#stage');
function fit(){const scale=Math.min((stage.clientWidth-24)/1280,(stage.clientHeight-24)/900,1);frame.style.transform='scale('+Math.max(.1,scale)+')';box.style.width=(1280*Math.max(.1,scale))+'px';box.style.height=(900*Math.max(.1,scale))+'px'}
function select(i){const item=screens[i];frame.src=item.file;frame.title='DontsTool · '+item.title;document.querySelector('#title').textContent='0'+(i+1)+' · '+item.title;document.querySelector('#description').textContent=item.description;document.querySelector('#source').href=item.file;document.querySelector('#preview').href='previews/'+item.slug+'.png';document.querySelectorAll('nav button').forEach((el,n)=>el.setAttribute('aria-current',n===i?'true':'false'));history.replaceState(null,'','#'+item.slug)}
document.querySelectorAll('nav button').forEach(el=>el.addEventListener('click',()=>select(Number(el.dataset.screen))));
function message(type,extra={}){frame.contentWindow.postMessage({type,...extra},location.origin==='null'?'*':location.origin)}
document.querySelector('#replay').addEventListener('click',()=>message('dt:replay'));
document.querySelector('#toggle').addEventListener('click',()=>message('dt:toggle'));
document.querySelector('#reduce').addEventListener('change',e=>message('dt:reduce',{value:e.target.checked}));
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin)return;if(e.data?.type==='dt:ready')message('dt:reduce',{value:document.querySelector('#reduce').checked});if(e.data?.type==='dt:navigate'){const i=screens.findIndex(s=>s.slug===e.data.scene);if(i>=0)select(i)}});
new ResizeObserver(fit).observe(stage);fit();const start=screens.findIndex(s=>'#'+s.slug===location.hash);if(start>0)select(start);
</script></body></html>
