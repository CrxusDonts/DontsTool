<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DontsTool · 网站多环境设计演示</title>
<style>
:root{color-scheme:dark;--desktop:#171b1d;--shell:#282d30;--header:#30363a;--area:#24282b;--inset:#1d2225;--text:#e8eceb;--muted:#9daaa7;--border:#3b4548;--accent:#6cd4bd;--selected:#3a514c;--test:#8ebbff;--prod:#e4b28b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-content:center;gap:18px;padding:24px;background:var(--desktop);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.demo-label{display:flex;align-items:center;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px}.demo-label a{color:var(--accent);text-decoration:none}.panel{width:700px;max-width:calc(100vw - 48px);height:480px;background:var(--shell);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 24px 64px #0006,0 4px 16px #0004;display:flex;flex-direction:column}.search{height:72px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--header)}.search>svg{color:var(--muted);flex-shrink:0}.search input{width:100%;min-width:0;background:none;border:0;outline:0;font-size:19px;font-weight:500;caret-color:var(--accent)}kbd{font:10px ui-monospace,"SFMono-Regular",Menlo,monospace;background:var(--inset);border:1px solid var(--border);border-radius:4px;min-width:18px;height:18px;padding:1px 4px;text-align:center;box-shadow:0 1px 1px #0002}.search>kbd{height:24px;display:grid;place-content:center;padding:0 7px;color:var(--muted);font-size:11px}main{padding:14px 12px 12px;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--area)}.group{font-size:11px;color:var(--muted);padding:0 10px 7px}.results{display:grid;gap:4px}.result{position:relative;display:flex;align-items:center;gap:12px;height:54px;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:0 12px;text-align:left;cursor:default}.result:hover{background:#ffffff05}.result[aria-selected=true]{background:var(--selected);border-color:#57736b}.result[aria-selected=true]:before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}.site-icon{display:grid;place-content:center;width:32px;height:32px;flex-shrink:0;border:1px solid var(--border);border-radius:6px;background:var(--shell);color:var(--muted)}[aria-selected=true] .site-icon{color:var(--accent)}.site-copy{flex:1;min-width:0}.title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;line-height:19px}.badge{display:inline-block;font:10px ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:.02em;padding:1px 5px;border-radius:4px;border:1px solid #66513e;color:var(--prod);background:#3c3329}.badge.test{color:var(--test);background:#26394d;border-color:#435e83}.url{display:block;margin-top:1px;color:var(--muted);font:11px/15px ui-monospace,"SFMono-Regular",Menlo,monospace;white-space:nowrap}.open{display:none;align-items:center;gap:5px;font-size:11px;color:var(--accent);padding:4px 7px;border:1px solid #678c7f;border-radius:5px;background:#243c34;flex-shrink:0}[aria-selected=true] .open{display:flex}.empty{padding:24px 10px;color:var(--muted);font-size:12px}.hint{margin-top:auto;padding:0 10px 2px;color:var(--muted);font-size:11px}.hint code{font:10px ui-monospace,"SFMono-Regular",Menlo,monospace;padding:2px 4px;background:var(--inset);border-radius:3px}footer{height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-top:1px solid var(--border);background:var(--inset);color:var(--muted);font-size:11px}.keys{display:flex;gap:14px}.keys>span{display:flex;align-items:center;gap:5px}.settings{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:3px;color:var(--muted);font-size:11px}.settings svg{width:14px;height:14px}.settings:hover{color:var(--text)}.status{min-height:18px;color:var(--muted);font-size:11px;max-width:700px;line-height:18px}.presets{display:flex;gap:9px}.presets button{border:0;background:none;padding:0;color:var(--accent);font-size:11px}.presets button:hover{text-decoration:underline}@media(max-width:580px){body{padding:12px}.panel{max-width:calc(100vw - 24px)}.open{padding:3px}.url{font-size:9px}.keys{gap:7px}.settings span{display:none}.demo-label{gap:8px;flex-wrap:wrap}}@media(prefers-reduced-motion:no-preference){.result,.settings{transition:background 120ms,border-color 120ms,color 120ms}}
</style>
<div class="demo-label"><span>DontsTool · 设计演示，非运行中的原生应用</span><div class="presets"><button data-query="ops 订单">全部环境</button><button data-query="ops test">仅 TEST</button><button data-query="ops prod">仅 PROD</button><a href="stitch-reference.html">Stitch 原稿 ↗</a></div></div>
<section class="panel" aria-label="网站多环境快捷入口设计演示">
  <header class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="query" value="ops 订单" aria-label="搜索网站快捷入口" autocomplete="off" spellcheck="false" autofocus><kbd>esc</kbd></header>
  <main><div class="group" id="count" aria-live="polite"></div><div class="results" id="results" role="listbox" aria-label="搜索结果"></div><div class="hint">输入 <code>ops test</code> 仅显示 TEST 环境</div></main>
  <footer><div class="keys"><span><kbd>↑</kbd><kbd>↓</kbd>选择</span><span><kbd>↵</kbd>打开</span><span><kbd>esc</kbd>关闭</span></div><button class="settings" title="设计演示：配置入口仅作布局参考"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m10 3-.6 3-2.3 1.3L4.2 6.4 2.3 9.7 4.6 12l-2.3 2.3 1.9 3.3 2.9-.9L9.4 18l.6 3h4l.6-3 2.3-1.3 2.9.9 1.9-3.3L19.4 12l2.3-2.3-1.9-3.3-2.9.9L14.6 6 14 3z"/></svg><span>配置快捷入口</span><kbd>⌘,</kbd></button></footer>
</section>
<div class="status" id="status" role="status">可输入查询并用 ↑↓ 选择；Enter 只显示预览目的地址。</div>
<script>
const websites=[{name:'订单后台',environment:'TEST',url:'https://orders.test.company.example'},{name:'订单后台',environment:'PROD',url:'https://orders.company.example'}];
const query=document.querySelector('#query'),results=document.querySelector('#results'),status=document.querySelector('#status');
let visible=[],selected=0;
const globe='<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5h14M5 17.5h14"/></svg>';
function render(reset=true){
  const words=query.value.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);
  visible=websites.filter(item=>words.every(word=>`${item.name} ${item.environment} ${item.url} ops`.toLocaleLowerCase().includes(word)));
  if(reset)selected=0;
  selected=Math.max(0,Math.min(selected,visible.length-1));
  document.querySelector('#count').textContent=`网站 · ${visible.length} 个结果`;
  results.replaceChildren();
  if(!visible.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='没有匹配的网站';results.append(empty);return;}
  visible.forEach((item,index)=>{const row=document.createElement('div');row.className='result';row.id=`result-${index}`;row.setAttribute('role','option');row.setAttribute('aria-selected',String(index===selected));const icon=document.createElement('div');icon.className='site-icon';icon.innerHTML=globe;const copy=document.createElement('div');copy.className='site-copy';const title=document.createElement('div');title.className='title';title.append(document.createTextNode(item.name));const badge=document.createElement('span');badge.className=`badge ${item.environment==='TEST'?'test':''}`;badge.textContent=item.environment;title.append(badge);const url=document.createElement('span');url.className='url';url.textContent=item.url;copy.append(title,url);const open=document.createElement('span');open.className='open';open.textContent='↵ 打开';row.append(icon,copy,open);row.addEventListener('click',()=>{selected=index;render(false);preview();});results.append(row);});
}
function preview(){const item=visible[selected];if(item)status.textContent=`设计演示：${item.environment} · ${item.url}（未打开网址）`;}
query.addEventListener('input',()=>render());
document.addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();if(visible.length)selected=(selected+(event.key==='ArrowDown'?1:-1)+visible.length)%visible.length;render(false);}else if(event.key==='Enter'){event.preventDefault();preview();}else if(event.key==='Escape'){query.value='';render();status.textContent='设计演示：已清空查询，原生应用中 Esc 关闭面板。';query.focus();}});
document.querySelectorAll('[data-query]').forEach(button=>button.addEventListener('click',()=>{query.value=button.dataset.query;render();query.focus();}));
document.querySelector('.settings').addEventListener('click',()=>status.textContent='设计演示：配置入口仅作布局参考，实际设置由原生应用提供。');
render();
</script>
</html>
