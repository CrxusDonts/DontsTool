<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" width="100%" height="100%" style="background:#f4f3ed; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'PingFang SC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#18786F" />
    </marker>
  </defs>

  <!-- Step 1 -->
  <g transform="translate(30, 28)">
    <rect width="190" height="74" rx="8" fill="#ffffff" stroke="#e3e1d8" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="14" y="16" width="22" height="22" rx="5" fill="#e8f3f1"/>
    <text x="25" y="31" font-size="11" font-weight="700" fill="#18786F" text-anchor="middle">1</text>
    <text x="46" y="32" font-size="13" font-weight="600" fill="#202220">读取文章</text>
    <text x="16" y="56" font-size="11" fill="#69716e">拉取最新版本与附件索引</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="228" y1="65" x2="276" y2="65" stroke="#18786F" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="0"/>

  <!-- Step 2 -->
  <g transform="translate(284, 28)">
    <rect width="190" height="74" rx="8" fill="#ffffff" stroke="#e3e1d8" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="14" y="16" width="22" height="22" rx="5" fill="#e8f3f1"/>
    <text x="25" y="31" font-size="11" font-weight="700" fill="#18786F" text-anchor="middle">2</text>
    <text x="46" y="32" font-size="13" font-weight="600" fill="#202220">编辑内容</text>
    <text x="16" y="56" font-size="11" fill="#69716e">Tiptap 纯净排版与本地草稿</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <line x1="482" y1="65" x2="530" y2="65" stroke="#18786F" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="0"/>

  <!-- Step 3 -->
  <g transform="translate(538, 28)">
    <rect width="190" height="74" rx="8" fill="#ffffff" stroke="#18786F" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="16" width="22" height="22" rx="5" fill="#18786F"/>
    <text x="25" y="31" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="46" y="32" font-size="13" font-weight="600" fill="#18786F">版本校验与保存</text>
    <text x="16" y="56" font-size="11" fill="#69716e">防冲突 baseRevision 回写</text>
  </g>
</svg>