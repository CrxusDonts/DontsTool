<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DontsTool · 知识库插件</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d9d8d2;color:#252b2d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header,footer{background:#efeee9;border-bottom:1px solid #c9cdc5;display:flex;align-items:center;gap:24px;padding:17px 28px}h1{font-size:16px;font-weight:600;margin:0}header p{font-size:12px;color:#66716e;margin:5px 0 0}nav{display:flex;gap:4px;margin-left:auto;background:#e1e1d9;padding:4px;border-radius:8px}button,a{font:inherit;font-size:12px;color:inherit}button{padding:8px 15px;border:0;border-radius:5px;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#f7f5f0;color:#18786f;box-shadow:0 1px 3px #283e321a}button:focus-visible,a:focus-visible{outline:2px solid #18786f;outline-offset:3px}.stage{height:calc(100vh - 150px);min-height:590px;overflow:auto;display:flex;align-items:center;justify-content:center}iframe{width:1160px;height:900px;border:0;display:block;flex-shrink:0;transform-origin:center}footer{border-top:1px solid #c9cdc5;border-bottom:0;padding:12px 28px;justify-content:space-between}footer p{font-size:12px;color:#66716e;margin:0;line-height:1.7}a{color:#18786f;text-decoration:none}a:hover{text-decoration:underline}.links{display:flex;gap:20px;white-space:nowrap}@media(max-width:760px){header{padding:15px;flex-wrap:wrap;gap:15px}nav{margin:0}footer{padding:13px 15px;flex-wrap:wrap;gap:12px}.stage{justify-content:flex-start;min-height:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div><h1>DontsTool · 知识库插件</h1><p>轻量入口 → 独立文章窗口</p></div><nav aria-label="设计屏幕"><button data-screen="home" aria-pressed="true">01 知识库入口</button><button data-screen="article" aria-pressed="false">02 完整文章编辑</button></nav></header>
<main class="stage"><iframe src="home.html" title="知识库插件：搜索文章入口"></iframe></main>
<footer><p id="caption">搜索文章、快速收集、收集箱，三个入口即可。双击搜索结果预览文章窗口。<br>Stitch 设计参考 · 示例数据与状态；真实搜索、编辑与保存尚未接入。</p><div class="links"><a id="html-link" href="home.html" target="_blank">打开 HTML ↗</a><a href="source.metadata.json">来源元数据</a><a href="README.md">接入边界</a></div></footer>
<script>
const frame=document.querySelector('iframe'),stage=document.querySelector('.stage');
function fit(){const ratio=Math.min(1,(innerWidth-16)/1160,Math.max(540,innerHeight-150)/900);frame.style.transform='scale('+ratio+')';stage.style.height=(900*ratio)+'px';}
for(const button of document.querySelectorAll('button[data-screen]'))button.onclick=()=>{const article=button.dataset.screen==='article';for(const b of document.querySelectorAll('button[data-screen]'))b.setAttribute('aria-pressed',String(b===button));frame.src=button.dataset.screen+'.html';frame.title=article?'完整文章独立窗口':'知识库插件：搜索文章入口';document.querySelector('#html-link').href=frame.src;document.querySelector('#caption').innerHTML=(article?'原生窗口标题、置顶和保存状态围绕一个完整正文编辑区。':'搜索文章、快速收集、收集箱，三个入口即可。双击搜索结果预览文章窗口。')+'<br>Stitch 设计参考 · 示例数据与状态；真实搜索、编辑与保存尚未接入。';};
addEventListener('resize',fit);fit();
</script></body></html>
