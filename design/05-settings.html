<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05 — 设置 · 通用 (Quiet Light)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Native macOS SF Pro Typography & System Look */
    :root {
      --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    }
    body {
      font-family: var(--font-system);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    /* Motion Specs */
    @keyframes windowEnter {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .window-animate-enter {
      animation: windowEnter 220ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Switch Interaction Transition */
    .native-switch-knob {
      transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .native-switch-track {
      transition: background-color 160ms ease, border-color 160ms ease;
    }

    /* Row Hover */
    .row-hover-transition {
      transition: background-color 100ms ease;
    }

    /* Custom native scrollbar for settings content if needed */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.12);
      border-radius: 9999px;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .window-animate-enter,
      .native-switch-knob,
      .native-switch-track,
      .row-hover-transition,
      * {
        animation: none !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
<link rel="stylesheet" href="motion.css"/>
</head>
<body class="bg-[#F4F6F8] w-[1280px] h-[900px] flex items-center justify-center relative overflow-hidden text-[#1d1d1f]">

  <!-- Subtle Blueprint dot-grid background for presentation canvas -->
  <div class="absolute inset-0 pointer-events-none opacity-[0.4]" 
       style="background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 24px 24px;"></div>

  <!-- Ambient soft radial shadow glow under the window -->
  <div class="absolute w-[820px] h-[620px] rounded-[18px] bg-black/10 blur-[36px] pointer-events-none transform translate-y-6"></div>

  <!-- Native macOS Settings Window (820px x 620px) -->
  <section data-dt-panel class="window-animate-enter relative w-[820px] h-[620px] rounded-[14px] bg-white/85 backdrop-blur-[28px] border border-black/10 shadow-[0_20px_48px_rgba(0,0,0,0.12),0_4px_12px_rgba(0,0,0,0.05)] flex overflow-hidden flex-col ring-1 ring-white/60">

    <!-- macOS Window Titlebar / Unified Toolbar Header -->
    <header class="h-[48px] flex-shrink-0 flex items-center justify-between px-4 border-b border-black/[0.06] select-none bg-white/40">
      <!-- Traffic Light Buttons -->
      <div class="flex items-center gap-[8px] w-[172px]">
        <button id="closeBtn" aria-label="关闭" class="w-[12px] h-[12px] rounded-full bg-[#FF5F56] border border-[#E0443E] hover:opacity-85 active:brightness-90 transition-opacity focus:outline-none"></button>
        <button aria-label="最小化" class="w-[12px] h-[12px] rounded-full bg-[#FFBD2E] border border-[#DEA123] hover:opacity-85 active:brightness-90 transition-opacity focus:outline-none"></button>
        <button aria-label="全屏" class="w-[12px] h-[12px] rounded-full bg-[#27C93F] border border-[#1AAB29] hover:opacity-85 active:brightness-90 transition-opacity focus:outline-none"></button>
      </div>

      <!-- Centered Window Title -->
      <div class="text-[13px] font-semibold text-[#1d1d1f]/85 tracking-[-0.01em]">
        DontsTool 设置
      </div>

      <!-- Right placeholder balancing layout -->
      <div class="w-[172px] flex justify-end"></div>
    </header>

    <!-- Main Window Split: Left Sidebar + Right Content -->
    <div class="flex flex-1 min-h-0">

      <!-- Left Navigation Sidebar (~172pt/176px) -->
      <aside class="w-[176px] flex-shrink-0 border-r border-black/[0.06] bg-[#fbfbfd]/70 flex flex-col justify-between p-3 select-none">
        <div>
          <!-- Modest Product Brand Glyph & Name -->
          <div class="flex items-center gap-2 px-2.5 py-2 mb-2">
            <div class="w-6 h-6 rounded-[6px] bg-blue-500/10 text-blue-600 flex items-center justify-center font-bold text-[12px] tracking-tight border border-blue-500/20 shadow-xs">
              DT
            </div>
            <span class="text-[13px] font-semibold text-[#1d1d1f] tracking-tight">DontsTool</span>
          </div>

          <!-- Navigation Items in strict required order -->
          <nav class="space-y-[2px]" aria-label="设置导航">
            <!-- 通用 (Selected) -->
            <button class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-[8px] bg-blue-600 text-white font-medium text-[13px] shadow-[0_1px_2px_rgba(0,100,255,0.2)] text-left focus:outline-none">
              <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
              <span>通用</span>
            </button>

            <!-- 搜索 -->
            <button class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-[8px] text-[#4b4b4e] hover:bg-black/[0.04] row-hover-transition text-[13px] text-left focus:outline-none">
              <svg class="w-4 h-4 text-[#86868b]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <span>搜索</span>
            </button>

            <!-- 工具 -->
            <button class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-[8px] text-[#4b4b4e] hover:bg-black/[0.04] row-hover-transition text-[13px] text-left focus:outline-none">
              <svg class="w-4 h-4 text-[#86868b]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
              <span>工具</span>
            </button>

            <!-- 翻译 -->
            <button class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-[8px] text-[#4b4b4e] hover:bg-black/[0.04] row-hover-transition text-[13px] text-left focus:outline-none">
              <svg class="w-4 h-4 text-[#86868b]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 8l6 6"></path>
                <path d="M4 14l6-6 2-3"></path>
                <path d="M2 5h12"></path>
                <path d="M7 2h1"></path>
                <path d="M22 22l-5-10-5 10"></path>
                <path d="M14 18h6"></path>
              </svg>
              <span>翻译</span>
            </button>

            <!-- 索引 -->
            <button class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-[8px] text-[#4b4b4e] hover:bg-black/[0.04] row-hover-transition text-[13px] text-left focus:outline-none">
              <svg class="w-4 h-4 text-[#86868b]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
              <span>索引</span>
            </button>

            <!-- 关于 -->
            <button class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-[8px] text-[#4b4b4e] hover:bg-black/[0.04] row-hover-transition text-[13px] text-left focus:outline-none">
              <svg class="w-4 h-4 text-[#86868b]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              <span>关于</span>
            </button>
          </nav>
        </div>

        <!-- Sidebar Footer -->
        <div class="px-2.5 py-2 border-t border-black/[0.06] flex items-center gap-1.5 text-[11px] text-[#86868b]">
          <span class="inline-flex items-center px-1.5 py-0.5 rounded bg-black/[0.05] border border-black/[0.06] font-mono text-[10px] text-[#555]">⌥ Space</span>
          <span>呼出启动器</span>
        </div>
      </aside>

      <!-- Right Main Content Area -->
      <main class="flex-1 flex flex-col min-h-0 bg-white/70 overflow-hidden">
        <div class="flex-1 min-h-0 overflow-y-auto custom-scroll dt-settings-content p-4 space-y-3">

          <!-- Content Header -->
          <div class="pb-1">
            <h1 class="text-[20px] font-bold text-[#1d1d1f] tracking-tight">通用</h1>
            
          </div>

          <!-- Group 1: 启动与快捷键 -->
          <div class="space-y-2">
            <h2 class="text-[11px] font-semibold text-[#86868b] tracking-wider uppercase px-0.5">启动与快捷键</h2>
            
            <div class="rounded-[10px] border border-black/[0.08] bg-white divide-y divide-black/[0.05] shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
              
              <!-- Row 1: 呼出快捷键 -->
              <div data-setting-row="hotkey" class="p-3.5 flex items-center justify-between hover:bg-[#fafafc] row-hover-transition">
                <div class="space-y-0.5 pr-4">
                  <div class="text-[13px] font-medium text-[#1d1d1f]">呼出快捷键</div>
                  <div class="text-[12px] text-[#6e6e73]">在任意应用中显示或隐藏启动器</div>
                </div>
                <!-- Focused Shortcut Recorder Control -->
                <button class="flex items-center gap-1 px-3 py-1.5 rounded-[6px] bg-blue-50/80 border border-blue-500/40 text-blue-600 font-mono text-[12px] font-semibold shadow-[0_0_0_2px_rgba(59,130,246,0.15)] hover:bg-blue-50 transition-colors focus:outline-none">
                  <span class="text-[13px]">⌥</span>
                  <span>Space</span>
                </button>
              </div>

              <!-- Row 2: 登录时启动 -->
              <div data-setting-row="autolaunch" class="p-3.5 flex items-center justify-between hover:bg-[#fafafc] row-hover-transition">
                <div class="space-y-0.5 pr-4">
                  <div class="text-[13px] font-medium text-[#1d1d1f]">登录时启动</div>
                  <div class="text-[12px] text-[#6e6e73]">在登录 Mac 后自动运行</div>
                </div>
                <!-- Native macOS Toggle Switch -->
                <button id="loginToggle" 
                        type="button" 
                        role="switch" 
                        aria-checked="true" 
                        class="native-switch-track relative inline-flex h-[20px] w-[36px] flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-blue-600 transition-colors duration-150 ease-in-out focus:outline-none">
                  <span class="sr-only">在登录 Mac 后自动运行</span>
                  <span id="loginToggleKnob" 
                        aria-hidden="true" 
                        class="native-switch-knob pointer-events-none inline-block h-[16px] w-[16px] transform rounded-full bg-white shadow-[0_1px_2px_rgba(0,0,0,0.2)] translate-x-[16px]"></span>
                </button>
              </div>

              <!-- Row 3: 外观 -->
              <div data-setting-row="appearance" class="p-3.5 flex items-center justify-between hover:bg-[#fafafc] row-hover-transition">
                <div class="space-y-0.5 pr-4">
                  <div class="text-[13px] font-medium text-[#1d1d1f]">外观</div>
                  <div class="text-[12px] text-[#6e6e73]">跟随 macOS 系统外观</div>
                </div>
                <!-- Read-only Appearance Badge -->
                <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-[6px] bg-black/[0.04] border border-black/[0.06] text-[#4b4b4e] text-[12px]">
                  <svg class="w-3.5 h-3.5 text-[#86868b]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                  </svg>
                  <span>跟随系统</span>
                </div>
              </div>

            </div>
          </div>

          <!-- Group 2: 应用索引 -->
          <div class="space-y-2">
            <h2 class="text-[11px] font-semibold text-[#86868b] tracking-wider uppercase px-0.5">应用索引</h2>
            
            <div class="rounded-[10px] border border-black/[0.08] bg-white p-3.5 flex items-center justify-between shadow-[0_1px_3px_rgba(0,0,0,0.02)] hover:bg-[#fafafc] row-hover-transition" data-setting-row="index">
              <div class="space-y-0.5 pr-4">
                <div class="flex items-center gap-2">
                  <span class="text-[13px] font-medium text-[#1d1d1f]">已索引 128 个应用</span>
                  <span class="inline-flex items-center px-1.5 py-0.2 rounded text-[10px] bg-green-500/10 text-green-700 font-medium border border-green-500/20">就绪</span>
                </div>
                <div class="text-[12px] text-[#6e6e73]">应用列表保存在本机，安装新应用后可手动更新。</div>
              </div>
              
              <!-- Rescan Button with Shortcut Hint -->
              <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-[11px] font-mono text-[#86868b]">⌘ R</span>
                <button id="rescanBtn" class="px-3 py-1.2 rounded-[6px] bg-white border border-black/15 text-[#1d1d1f] hover:bg-black/[0.03] active:bg-black/[0.06] text-[12px] font-medium shadow-xs transition-colors focus:outline-none flex items-center gap-1.5">
                  <svg id="rescanIcon" class="w-3.5 h-3.5 text-[#555]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                  </svg>
                  <span>重新扫描</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Group 3: 使用说明 -->
          <div class="space-y-2">
            <h2 class="text-[11px] font-semibold text-[#86868b] tracking-wider uppercase px-0.5">使用说明</h2>
            
            <div class="rounded-[10px] border border-black/[0.08] bg-white divide-y divide-black/[0.05] shadow-[0_1px_3px_rgba(0,0,0,0.02)]" data-setting-row="guide">
              
              <div class="px-3.5 py-2.5 flex items-center justify-between text-[12px]">
                <span class="text-[#4b4b4e]">选择结果</span>
                <div class="flex items-center gap-1">
                  <kbd class="px-1.5 py-0.5 rounded bg-black/[0.04] border border-black/[0.08] font-mono text-[11px] text-[#333]">↑</kbd>
                  <kbd class="px-1.5 py-0.5 rounded bg-black/[0.04] border border-black/[0.08] font-mono text-[11px] text-[#333]">↓</kbd>
                </div>
              </div>

              <div class="px-3.5 py-2.5 flex items-center justify-between text-[12px]">
                <span class="text-[#4b4b4e]">执行操作</span>
                <kbd class="px-1.5 py-0.5 rounded bg-black/[0.04] border border-black/[0.08] font-mono text-[11px] text-[#333]">↵</kbd>
              </div>

              <div class="px-3.5 py-2.5 flex items-center justify-between text-[12px]">
                <span class="text-[#4b4b4e]">执行次操作</span>
                <div class="flex items-center gap-1">
                  <kbd class="px-1.5 py-0.5 rounded bg-black/[0.04] border border-black/[0.08] font-mono text-[11px] text-[#333]">⌘</kbd>
                  <kbd class="px-1.5 py-0.5 rounded bg-black/[0.04] border border-black/[0.08] font-mono text-[11px] text-[#333]">↵</kbd>
                </div>
              </div>

              <div class="px-3.5 py-2.5 flex items-center justify-between text-[12px]">
                <span class="text-[#4b4b4e]">关闭面板</span>
                <kbd class="px-1.5 py-0.5 rounded bg-black/[0.04] border border-black/[0.08] font-mono text-[11px] text-[#333]">esc</kbd>
              </div>

            </div>
          </div>

          <!-- Bottom Privacy Note -->
          <div class="pt-1 flex items-center justify-center gap-1.5 text-[11px] text-[#86868b]">
            <svg class="w-3.5 h-3.5 text-[#86868b]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>设置与使用记录仅保存在本机</span>
          </div>

        </div>
      </main>

    </div>
  </section>

  <!-- Interactive JavaScript for prototype fidelity (160ms switch, Esc close, 140ms animation) -->
  
<script src="motion.js"></script>
</body>
</html>
