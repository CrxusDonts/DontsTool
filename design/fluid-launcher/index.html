};
const contentActions = {
  json:[{id:'content-json',title:'打开 JSON 工具',subtitle:'带入原文，在独立窗口中编辑和处理',icon:'json',keyword:'json',aliases:['json','格式化'],kind:'tool'}],
  url:[{id:'content-browser',title:'在默认浏览器打开',subtitle:'打开这条网页链接',icon:'link',aliases:['浏览器','browser','打开链接'],kind:'browser'},
       {id:'content-url-encode',title:'打开 URL 编码',subtitle:'带入原文，在独立窗口中编辑和处理',icon:'link',keyword:'url',aliases:['url','encode','编码'],kind:'tool'},
       {id:'content-url-decode',title:'打开 URL 解码',subtitle:'带入原文，在独立窗口中编辑和处理',icon:'link',keyword:'urld',aliases:['url','decode','解码'],kind:'tool'}],
  text:[{id:'content-base64-encode',title:'打开 Base64 编码',subtitle:'带入原文，在独立窗口中编辑和处理',icon:'base64',keyword:'b64',aliases:['base64','b64','encode','编码'],kind:'tool'},
        {id:'content-base64-decode',title:'打开 Base64 解码',subtitle:'带入原文，在独立窗口中编辑和处理',icon:'base64',keyword:'b64d',aliases:['base64','b64d','decode','解码'],kind:'tool'},
        {id:'content-translation',title:'打开翻译',subtitle:'带入原文，在独立窗口中发起翻译',icon:'translation',keyword:'tr',aliases:['tr','translate','翻译','fanyi','fy'],kind:'tool'}]
};
const state = {items:[],selected:0,payload:null,popover:false,actionIndex:0,shown:true,sort:'recent',manualReduced:false};
let toastTimer;
let replayTimer;
function toast(message){
  clearTimeout(toastTimer);
  $('toast').textContent = '交互预览 · ' + message;
  $('toast').classList.add('is-visible');
  toastTimer = setTimeout(() => $('toast').classList.remove('is-visible'),2600);
}
function primaryTitle(item){return item.kind === 'app' ? '打开' : item.kind === 'browser' ? '打开链接' : '打开工具窗口';}
function normalize(value){return value.trim().toLocaleLowerCase().replace(/\s+/g,'');}
function render(){
  closeActions(false);
  const query = normalize(search.value);
  const source = state.payload ? contentActions[state.payload.kind] : appData;
  state.items = source.filter(item => !query || [item.title,item.keyword || '',...item.aliases].some(value => normalize(value).includes(query)));
  if(!state.payload){
    state.items.sort((a,b) => state.sort === 'name' ? a.title.localeCompare(b.title,'zh-Hans') : b[state.sort] - a[state.sort]);
  }
  state.selected = 0;
  rows.replaceChildren();
  state.items.forEach((item,index) => {
    const row = document.createElement('div');
    row.className = 'result-row'; row.id = 'result-' + item.id;
    row.setAttribute('role','option'); row.setAttribute('aria-selected','false');
    const icon = document.createElement('span'); icon.className = 'app-icon ' + item.icon; icon.setAttribute('aria-hidden','true'); icon.innerHTML = icons[item.icon];
    const copy = document.createElement('span'); copy.className = 'item-copy';
    const title = document.createElement('span'); title.className = 'item-title'; title.textContent = item.title;
    const subtitle = document.createElement('span'); subtitle.className = 'item-subtitle'; subtitle.textContent = item.subtitle;
    copy.append(title,subtitle); row.append(icon,copy);
    if(item.keyword){const keyword=document.createElement('span');keyword.className='item-keyword';keyword.textContent=item.keyword;row.append(keyword);}
    const hint = document.createElement('span'); hint.className='execute-hint';hint.textContent=primaryTitle(item)+' ↵';hint.setAttribute('aria-hidden','true');row.append(hint);
    row.addEventListener('pointermove',() => {if(!state.popover && state.selected !== index) select(index,false);});
    row.addEventListener('click',() => {select(index,false);runItem();search.focus({preventScroll:true});});
    rows.append(row);
  });
  $('empty').hidden = state.items.length !== 0;
  $('empty-title').textContent = state.payload ? '没有匹配的可用操作' : '没有匹配结果';
  $('empty-help').textContent = state.payload ? '试试操作名称或关键词，也可以移除附加内容。' : '换一个名称，或试试拼音首字母。';
  $('sort-control').hidden = Boolean(state.payload);
  $('result-group').textContent = state.payload ? '可用操作' : query ? '搜索结果' : {recent:'最近使用',frequency:'使用频率',name:'按名称排列'}[state.sort];
  $('payload').hidden = !state.payload;
  search.placeholder = state.payload ? '筛选可用操作…' : '搜索应用、工具、网址…';
  if(state.payload){
    $('payload-title').textContent = state.payload.title;
    $('payload-count').textContent = Array.from(state.payload.text).length + ' 个字符';
    $('payload-icon').textContent = state.payload.icon;
  }
  $('result-status').textContent = (state.payload ? state.payload.title+'，' : '') + '共 ' + state.items.length + ' 项结果';
  $('toggle-actions').disabled = state.items.length === 0;
  scrollArea.scrollTop = 0;
  select(0,false);
}
function select(index,ensureVisible=true){
  if(!state.items.length){selection.hidden=true;search.removeAttribute('aria-activedescendant');return;}
  state.selected = Math.min(Math.max(index,0),state.items.length-1);
  selection.hidden=false;
  selection.style.transform='translateY('+(state.selected*54)+'px)';
  Array.from(rows.children).forEach((row,i)=>row.setAttribute('aria-selected',String(i===state.selected)));
  const row=rows.children[state.selected];
  search.setAttribute('aria-activedescendant',row.id);
  if(ensureVisible) row.scrollIntoView({block:'nearest',behavior:'instant'});
}
function runItem(action){
  const item=state.items[state.selected];
  if(!item)return;
  const verb=action || primaryTitle(item);
  toast(verb+'「'+item.title+'」');
  closeActions();
}
function actionsFor(item){return item.kind==='app' ? ['打开','在访达中显示','复制路径'] : [primaryTitle(item)];}
const actionIcons=[
  '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14M9 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
  '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7V5h6l2 2h10v13H3V7Zm0 3h18"/></svg>',
  '<svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v14h5"/></svg>'
];
function openActions(){
  const item=state.items[state.selected]; if(!item)return;
  state.popover=true;state.actionIndex=0;
  $('action-target').textContent=item.title;
  $('action-options').replaceChildren();
  actionsFor(item).forEach((action,index)=>{
    const button=document.createElement('button');button.type='button';button.className='action-option';
    button.innerHTML=actionIcons[index] || actionIcons[0];
    const text=document.createElement('span');text.textContent=action;button.append(text);
    if(index===0){const hint=document.createElement('span');hint.className='return-key';hint.textContent='↵';button.append(hint);}
    button.addEventListener('pointermove',()=>selectAction(index,false));
    button.addEventListener('click',()=>runItem(action));
    $('action-options').append(button);
  });
  $('action-popover').classList.add('is-open');$('action-popover').setAttribute('aria-hidden','false');$('toggle-actions').setAttribute('aria-expanded','true');
  selectAction(0);
}
function selectAction(index,focus=true){
  const buttons=Array.from($('action-options').children);
  state.actionIndex=Math.max(0,Math.min(index,buttons.length-1));
  buttons.forEach((button,i)=>button.classList.toggle('is-current',i===state.actionIndex));
  if(focus) buttons[state.actionIndex]?.focus({preventScroll:true});
}
function closeActions(restoreFocus=true){
  const wasOpen=state.popover;state.popover=false;
  $('action-popover').classList.remove('is-open');$('action-popover').setAttribute('aria-hidden','true');$('toggle-actions').setAttribute('aria-expanded','false');
  Array.from($('action-options').children).forEach(button=>button.tabIndex=-1);
  if(wasOpen&&restoreFocus&&state.shown)search.focus({preventScroll:true});
}
function showPanel(){
  state.shown=true;panel.classList.remove('is-hidden');panel.removeAttribute('inert');panel.setAttribute('aria-hidden','false');
  search.setAttribute('aria-expanded','true');search.focus({preventScroll:true});
}
function hidePanel(){
  clearTimeout(replayTimer);closeActions(false);state.shown=false;
  panel.classList.add('is-hidden');panel.setAttribute('inert','');panel.setAttribute('aria-hidden','true');search.setAttribute('aria-expanded','false');
  $('replay').focus({preventScroll:true});
}
$('replay').addEventListener('click',()=>{
  hidePanel();
  replayTimer=setTimeout(showPanel,media.matches||state.manualReduced?0:210);
});
search.addEventListener('input',event=>{if(!event.isComposing)render();});
search.addEventListener('compositionend',render);
$('sort').addEventListener('change',event=>{state.sort=event.target.value;render();search.focus({preventScroll:true});});
$('toggle-actions').addEventListener('click',()=>state.popover?closeActions():openActions());
$('close-panel').addEventListener('click',hidePanel);
$('settings').addEventListener('click',()=>toast('打开设置'));
$('clear-payload').addEventListener('click',()=>{state.payload=null;search.value='';render();search.focus({preventScroll:true});});
document.querySelectorAll('[data-sample]').forEach(button=>button.addEventListener('click',()=>{
  clearTimeout(replayTimer);state.payload=samples[button.dataset.sample];search.value='';render();showPanel();
}));
document.querySelectorAll('[data-theme-value]').forEach(button=>button.addEventListener('click',()=>{
  document.documentElement.dataset.theme=button.dataset.themeValue;
  document.querySelectorAll('[data-theme-value]').forEach(choice=>choice.setAttribute('aria-pressed',String(choice===button)));
}));
function applyMotion(){
  const reduced=state.manualReduced||media.matches;
  document.documentElement.classList.toggle('reduce-motion',reduced);
  $('reduce-motion').checked=reduced;$('reduce-motion').disabled=media.matches;
  $('reduce-motion').title=media.matches?'已跟随系统开启减少动态效果':'手动减少动态效果';
}
$('reduce-motion').addEventListener('change',event=>{state.manualReduced=event.target.checked;applyMotion();});
media.addEventListener('change',applyMotion);
document.addEventListener('pointerdown',event=>{
  if(state.popover&&!$('action-popover').contains(event.target)&&!$('toggle-actions').contains(event.target))closeActions(false);
});
document.addEventListener('keydown',event=>{
  if(event.isComposing||!state.shown)return;
  if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){
    event.preventDefault();state.popover?closeActions():openActions();return;
  }
  if(!panel.contains(document.activeElement))return;
  if(event.key==='Escape'){event.preventDefault();state.popover?closeActions():hidePanel();return;}
  if(document.activeElement===$('sort'))return;
  if(event.key==='ArrowDown'||event.key==='ArrowUp'){
    event.preventDefault();const delta=event.key==='ArrowDown'?1:-1;
    state.popover?selectAction(state.actionIndex+delta):select(state.selected+delta);return;
  }
  if(event.key==='Enter'&&document.activeElement===search){event.preventDefault();runItem();}
});
applyMotion();render();
requestAnimationFrame(()=>search.focus({preventScroll:true}));
</script>
</body>
